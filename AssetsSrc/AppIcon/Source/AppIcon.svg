<?xml version="1.0" encoding="UTF-8"?>
<!-- CutADash アプリアイコン(1024x1024)。Windows 11のFluentデザインに寄せた、
     奥行きのある(影・ハイライト付きの)クリップボード。背景のタイルは持たない。
     これをヘッドレスEdgeでPNG化したものが AppIcon.png(build-app-icon.pyの入力)。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- ボード(アクセントの青) -->
    <linearGradient id="board" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5CB0FF"/>
      <stop offset="0.55" stop-color="#2A7FEB"/>
      <stop offset="1" stop-color="#1B5FCE"/>
    </linearGradient>
    <!-- ボード上端の細いハイライト線 -->
    <linearGradient id="boardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B3A8C" stop-opacity="0.35"/>
    </linearGradient>
    <!-- 紙 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F1FD"/>
    </linearGradient>
    <!-- クリップ(金属調) -->
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="0.5" stop-color="#CBD5E3"/>
      <stop offset="1" stop-color="#9AA9BF"/>
    </linearGradient>
    <!-- 紙の上の行(青) -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A7FEB"/>
      <stop offset="1" stop-color="#5CB0FF"/>
    </linearGradient>

    <filter id="shadowBig" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dy="34" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ボード -->
  <g filter="url(#shadowBig)">
    <rect x="152" y="120" width="720" height="808" rx="112" fill="url(#board)"/>
  </g>
  <rect x="153.5" y="121.5" width="717" height="805" rx="110.5" fill="none" stroke="url(#boardEdge)" stroke-width="3"/>

  <!-- 紙 -->
  <g filter="url(#shadowSmall)">
    <rect x="236" y="236" width="552" height="620" rx="56" fill="url(#paper)"/>
  </g>

  <!-- 紙の上の行(丸い点 + 線) -->
  <circle cx="330" cy="400" r="30" fill="url(#line)"/>
  <rect x="396" y="374" width="296" height="52" rx="26" fill="url(#line)"/>
  <circle cx="330" cy="544" r="30" fill="url(#line)"/>
  <rect x="396" y="518" width="296" height="52" rx="26" fill="url(#line)"/>
  <circle cx="330" cy="688" r="30" fill="url(#line)"/>
  <rect x="396" y="662" width="196" height="52" rx="26" fill="url(#line)"/>

  <!-- クリップ -->
  <g filter="url(#shadowSmall)">
    <rect x="342" y="72" width="340" height="176" rx="64" fill="url(#clip)"/>
  </g>
  <rect x="343.5" y="73.5" width="337" height="173" rx="62.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>
  <rect x="420" y="118" width="184" height="46" rx="23" fill="#5B6B83" fill-opacity="0.55"/>
  <rect x="420" y="118" width="184" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
</svg>
